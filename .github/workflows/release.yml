name: Release

# Maintainers publish the GitHub Release after merging and checking CI.
# Manual dispatch retries a published release, using its explicit stable tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release tag (e.g. v0.1.1)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      rockspec: ${{ steps.rockspec.outputs.rockspec }}
    steps:
      - name: Validate published release tag
        id: version
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a stable version tag such as v0.1.1"
            exit 1
          fi
          DRAFT=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.draft')
          if [ "$DRAFT" != false ]; then
            echo "::error::Publish the GitHub Release before retrying"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.version.outputs.tag }}
          fetch-depth: 0

      - name: Check merged source and version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          bash scripts/version-manager.sh check "$VERSION"

      - name: Setup Lua
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.1"

      - name: Setup LuaRocks
        uses: leafo/gh-actions-luarocks@v6

      - name: Determine revision (query luarocks.org)
        id: revision
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          SEARCH=$(mktemp "${RUNNER_TEMP}/luarocks-search.XXXXXX")
          trap 'rm -f "$SEARCH"' EXIT
          luarocks search lua-slds --porcelain > "$SEARCH"
          # Exact package/version match; no existing revision is a normal first release.
          REV=$(awk -v prefix="${VERSION}-" '
            $1 == "lua-slds" && index($2, prefix) == 1 {
              revision = substr($2, length(prefix) + 1)
              if (revision ~ /^[0-9]+$/ && revision + 0 > max) max = revision + 0
            }
            END { print max + 1 }
          ' "$SEARCH")
          echo "revision=$REV" >> "$GITHUB_OUTPUT"

      - name: Generate and lint versioned rockspec
        id: rockspec
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REV: ${{ steps.revision.outputs.revision }}
        run: |
          ROCKSPEC="lua-slds-${VERSION}-${REV}.rockspec"
          sed -e "s/version = \"scm-1\"/version = \"${VERSION}-${REV}\"/" \
              -e "s/branch = \"main\"/tag = \"v${VERSION}\"/" \
              lua-slds-scm-1.rockspec > "$ROCKSPEC"
          luarocks lint "$ROCKSPEC"
          echo "rockspec=$ROCKSPEC" >> "$GITHUB_OUTPUT"

      - name: Upload rockspec artifact
        uses: actions/upload-artifact@v4
        with:
          name: rockspec
          path: ${{ steps.rockspec.outputs.rockspec }}

  release:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Download rockspec
        uses: actions/download-artifact@v4
        with:
          name: rockspec

      - name: Attach source and rockspec to published release
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          ROCKSPEC: ${{ needs.prepare.outputs.rockspec }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git archive --format=tar.gz --prefix="lua-slds-${VERSION}/" \
            -o "lua-slds-${VERSION}.tar.gz" HEAD
          gh release upload "$TAG" "lua-slds-${VERSION}.tar.gz" "$ROCKSPEC" \
            --repo "$GITHUB_REPOSITORY" --clobber

  # Configure LUAROCKS_API_KEY in the deploy environment or repository secrets.
  luarocks:
    needs: [release, prepare]
    environment: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Download rockspec
        uses: actions/download-artifact@v4
        with:
          name: rockspec

      - name: Setup Lua
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.1"

      - name: Setup LuaRocks
        uses: leafo/gh-actions-luarocks@v6

      - name: Upload to LuaRocks
        env:
          LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
          ROCKSPEC: ${{ needs.prepare.outputs.rockspec }}
        run: |
          KEY=$(printf '%s' "$LUAROCKS_API_KEY" | tr -d '\n\r \t')
          if [ -z "$KEY" ]; then
            echo "::error::LUAROCKS_API_KEY is required to publish"
            exit 1
          fi
          echo "::add-mask::$KEY"
          luarocks upload "$ROCKSPEC" --api-key="$KEY"
