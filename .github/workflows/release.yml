name: Release

# Triggered when a version tag (v*) is pushed.
# Convention: tag name = v<version>, e.g. v0.1.0, v0.2.0-rc1
#
# Rockspec strategy (industry convention, same as lua-resty-http / lua-cjson):
#   - Only lua-slds-scm-1.rockspec lives in the repo (single source of truth)
#   - Versioned rockspec is GENERATED by CI from scm at release time
#   - Revision (-1, -2, ...) is auto-determined by querying luarocks.org:
#       new version  → rev 1
#       re-publish   → max(existing rev) + 1
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Generate versioned rockspec from scm, auto-determine revision ──
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      revision: ${{ steps.revision.outputs.revision }}
      rockspec: ${{ steps.rockspec.outputs.rockspec }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Sync version across all sources
        # Auto-fix version drift before publishing. Runs version-manager.sh
        # sync (driven by .versions, shared with release.sh) to align all
        # version sources to the tag version. If any file changed, commit +
        # push to main; then run check to verify consistency.
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Tag version: $VERSION"
          chmod +x scripts/version-manager.sh
          if scripts/version-manager.sh sync "$VERSION"; then
            echo "No version drift — all sources at $VERSION"
          else
            echo "Version drift detected and auto-synced, committing to main"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add $(scripts/version-manager.sh list)
            git commit -m "chore: sync version to $VERSION [skip ci]"
            git push origin HEAD:main || \
              echo "::warning::Could not push version sync to main (new commits after tag). Version synced in CI workspace only."
          fi
          # Verify consistency — fail the job if any source is still wrong
          scripts/version-manager.sh check "$VERSION"

      - name: Setup Lua
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.1"

      - name: Setup LuaRocks
        uses: leafo/gh-actions-luarocks@v6

      - name: Determine revision (query luarocks.org)
        id: revision
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Query luarocks.org for existing revisions of this version
          # porcelain output: "lua-slds  0.1.0-1  rock"
          EXISTING=$(luarocks search lua-slds --porcelain 2>/dev/null \
            | awk '/^lua-slds/ {print $2}' \
            | grep "^${VERSION}-" \
            | sed "s/^${VERSION}-//" \
            | sort -V \
            | tail -1)
          if [ -n "$EXISTING" ]; then
            REV=$((EXISTING + 1))
            echo "Version ${VERSION} already on luarocks.org (rev ${EXISTING}), bumping to rev ${REV}"
          else
            REV=1
            echo "New version ${VERSION}, using rev 1"
          fi
          echo "revision=${REV}" >> $GITHUB_OUTPUT

      - name: Generate versioned rockspec from scm
        id: rockspec
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          REV="${{ steps.revision.outputs.revision }}"
          ROCKSPEC="lua-slds-${VERSION}-${REV}.rockspec"
          # Transform scm -> versioned: version string + source (branch -> tag)
          sed -e "s/version = \"scm-1\"/version = \"${VERSION}-${REV}\"/" \
              -e "s/branch = \"main\"/tag = \"v${VERSION}\"/" \
              lua-slds-scm-1.rockspec > "$ROCKSPEC"
          echo "=== Generated ${ROCKSPEC} ==="
          cat "$ROCKSPEC"
          echo "rockspec=${ROCKSPEC}" >> $GITHUB_OUTPUT

      - name: Upload rockspec artifact
        uses: actions/upload-artifact@v4
        with:
          name: rockspec
          path: lua-slds-*.rockspec

  # ── Create GitHub Release with tarball + rockspec ──
  release:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download rockspec
        uses: actions/download-artifact@v4
        with:
          name: rockspec

      - name: Create source tarball
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          git archive --format=tar.gz \
            --prefix=lua-slds-${VERSION}/ \
            -o lua-slds-${VERSION}.tar.gz HEAD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: lua-slds v${{ needs.prepare.outputs.version }}
          body: |
            Pure Lua domain library for short link identity, lifecycle,
            and resolution semantics.

            ## 安装

            ```bash
            luarocks install lua-slds
            ```

            ## 主要特性

            - Identity / ShortLink / Lifecycle / Resolution 领域模型
            - 六边形架构端口：Repository / Generator / Encoder
            - Hooks 扩展机制（pcall 隔离）
            - Conformance Test Suite L0-L3
            - 零外部依赖（纯 Lua 5.1/5.3/LuaJIT）

            ## 文档

            - [README](https://github.com/fangfengxiang/lua-slds#readme)
            - [API 文档](https://github.com/fangfengxiang/lua-slds/blob/main/docs/api.md)
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            lua-slds-${{ needs.prepare.outputs.version }}.tar.gz
            ${{ needs.prepare.outputs.rockspec }}

  # ── Publish to LuaRocks.org ──
  # Requires LUAROCKS_API_KEY secret (Settings → Secrets → Actions).
  # If not configured, upload is skipped; lint still runs.
  luarocks:
    needs: [release, prepare]
    environment: deploy
    runs-on: ubuntu-latest
    env:
      LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Download rockspec
        uses: actions/download-artifact@v4
        with:
          name: rockspec

      - name: Setup Lua
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.1"

      - name: Setup LuaRocks
        uses: leafo/gh-actions-luarocks@v6

      - name: Lint rockspec
        run: luarocks lint "${{ needs.prepare.outputs.rockspec }}"

      - name: Diagnose API key & connectivity
        if: ${{ env.LUAROCKS_API_KEY != '' }}
        run: |
          echo "luarocks: $(luarocks --version)"
          KEY_CLEAN="$(printf '%s' "$LUAROCKS_API_KEY" | tr -d '\n\r \t')"
          echo "raw key length:   ${#LUAROCKS_API_KEY}"
          echo "clean key length: ${#KEY_CLEAN}"
          if [ "${#LUAROCKS_API_KEY}" != "${#KEY_CLEAN}" ]; then
            echo "::warning::API key had stray whitespace/newline (auto-stripped). Re-save the secret cleanly to stop this recurring."
          fi
          STATUS_FILE=$(mktemp "${RUNNER_TEMP}/luarocks-status.XXXXXX")
          trap 'rm -f "$STATUS_FILE"' EXIT
          code=$(curl -sS -o "$STATUS_FILE" -w "%{http_code}" "https://luarocks.org/api/1/${KEY_CLEAN}/status")
          echo "luarocks.org /status HTTP code: ${code}"
          echo "response body:"
          head -c 300 "$STATUS_FILE"
          echo
          if [ "$code" = "401" ]; then
            echo "::error::API key invalid (HTTP 401). Recreate at https://luarocks.org/settings/api-keys and update LUAROCKS_API_KEY secret."
            exit 1
          fi
          if [ "$code" != "200" ]; then
            echo "::error::Unexpected /status code $code. See body above."
            exit 1
          fi
          echo "LUAROCKS_API_KEY=${KEY_CLEAN}" >> "$GITHUB_ENV"

      - name: Upload to LuaRocks
        if: ${{ env.LUAROCKS_API_KEY != '' }}
        run: |
          KEY="$(printf '%s' "$LUAROCKS_API_KEY" | tr -d '\n\r \t')"
          luarocks upload "${{ needs.prepare.outputs.rockspec }}" --api-key="$KEY"
