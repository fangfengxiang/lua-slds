site_name: lua-slds
site_url: https://fangfengxiang.github.io/lua-slds/
site_description: "Short Link Domain Specification — a pure Lua domain library for short link identity, lifecycle, and resolution semantics."
repo_url: https://github.com/fangfengxiang/lua-slds
repo_name: fangfengxiang/lua-slds
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Roboto
    code: JetBrains Mono

plugins:
  - search
  - mermaid2

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Tutorial:
    - Quick Start: tutorial.md
  - How-To:
    - Operations Guide: how-to.md
  - Reference:
    - API Reference: api.md
    - RFC-0001: rfc/RFC-0001.md
    - Conformance Tests: rfc/conformance-tests.md
    - Validation & Migration: validation.md
  - Explanation:
    - Design Rationale: design/design-rationale.md
    - Domain Layer: design/domain-layer.md
    - Ports & Adapters: design/port-adapter.md
    - Architecture Decisions: adr/decisions.md
